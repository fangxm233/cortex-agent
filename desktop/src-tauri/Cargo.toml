[package]
name = "cortex-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and to allow integration tests to import the crate by name.
name = "cortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Desktop-only dependencies ──
# keyring: the OS keychain has NO Android backend (Android uses an app-private file store in
#   creds.rs instead), so the crate is only pulled in for desktop targets.
# reqwest/sha2/zip: the frontend OTA updater. reqwest's native-TLS (openssl) is painful to
#   cross-compile for Android and unneeded there (the APK ships the frontend embedded), so the
#   OTA module + its deps are desktop-only (see `#[cfg(not(target_os = "android"))] mod ota` in lib.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = [] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"   # Strip expensive panic clean-up logic
codegen-units = 1 # Compile the entire crate as one unit
lto = true        # Perform link-time-optimizations
opt-level = "s"   # Optimize for binary size
strip = true      # Automatically strip symbols from the binary
