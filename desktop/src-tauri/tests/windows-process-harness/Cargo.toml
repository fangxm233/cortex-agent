[package]
name = "cortex-windows-process-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects", "Win32_Security", "Win32_System_Pipes",
] }

[[bin]]
name = "owned-fixture"
path = "fixture.rs"

[[test]]
name = "owned"
path = "owned.rs"
