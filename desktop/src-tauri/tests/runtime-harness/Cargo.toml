[package]
name = "cortex-runtime-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
path = "../../src/setup/runtime_tests.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The encoder only builds test fixtures; the product compiles the decoder alone.
sevenz-rust2 = { version = "0.20", default-features = false, features = ["compress"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Security"] }
