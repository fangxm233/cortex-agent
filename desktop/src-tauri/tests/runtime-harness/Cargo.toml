[package]
name = "cortex-runtime-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
path = "../../src/setup/runtime_tests.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Compile the exact Windows PortableGit reader headlessly (no Tauri or external extractor).
sevenz-rust2 = { version = "=0.20.2", default-features = false }
lzma-rust2 = { version = "=0.16.5", default-features = false, features = ["std", "optimization"] }
crc32fast = "=1.5.0"
flate2 = "1"
tar = "0.4"
tempfile = "3"
libc = "0.2"
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Security"] }
