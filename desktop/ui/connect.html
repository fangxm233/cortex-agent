<!-- output: themed local/remote connection setup page -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cortex — Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <meta name="theme-color" content="">
  <script>
    // No-flash appearance: apply the persisted theme, accent, surface, and motion before first paint.
    // Mirrors web/src/theme/theme.ts + web/index.html so the connect screen matches the SPA.
    (function () {
      try {
        var stored = null;
        try { stored = window.localStorage.getItem('cortex.theme'); } catch (e) {}
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var preference = stored === 'light' || stored === 'dark' || stored === 'system'
          ? stored : prefersDark ? 'dark' : 'light';
        var theme = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = theme;
        var storedAccent = null;
        try { storedAccent = window.localStorage.getItem('cortex.accent-hue'); } catch (e) {}
        var accentHue = Number(storedAccent);
        if (storedAccent !== null && storedAccent.trim() !== '' && Number.isInteger(accentHue) && accentHue >= 0 && accentHue <= 359) {
          document.documentElement.setAttribute('data-accent', 'custom');
          document.documentElement.style.setProperty('--accent-hue', String(accentHue));
        }
        var surface = null;
        try { surface = window.localStorage.getItem('cortex.surface'); } catch (e) {}
        if (surface === 'neutral' || surface === 'contrast') {
          document.documentElement.setAttribute('data-surface', surface);
        }
        var intensity = null;
        try { intensity = window.localStorage.getItem('cortex.accent-intensity'); } catch (e) {}
        if (intensity === 'soft' || intensity === 'vivid') {
          document.documentElement.setAttribute('data-accent-intensity', intensity);
        }
        var motion = null;
        try { motion = window.localStorage.getItem('cortex.motion'); } catch (e) {}
        if (motion === 'full' || motion === 'reduced') {
          document.documentElement.setAttribute('data-motion', motion);
        }
        var chrome = getComputedStyle(document.documentElement).getPropertyValue('--browser-theme-color').trim();
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && chrome) meta.setAttribute('content', chrome);
      } catch (e) {}
    })();

    // Mobile vs desktop layout. The native shell injects `window.__CORTEX_MOBILE__ = true` on Android
    // (init_script in lib.rs) BEFORE this runs, so we can pick the full-bleed mobile layout up-front —
    // the `.mobile` class on <html> gates the mobile CSS, so there is no desktop→mobile layout flash.
    (function () {
      try {
        if (window.__CORTEX_MOBILE__) document.documentElement.classList.add('mobile');
      } catch (e) {}
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Body uses the app's system-sans stack (web/src/index.css @layer base); IBM Plex Mono is reserved
     * for technical/mono content (the logo + the URL/token inputs), matching the SPA's mono usage. */
    html, body {
      height: 100%;
      background: var(--surface-base);
      color: var(--proto-ink);
      font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial,
        'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .mono {
      font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
    }

    /* Settings-style card (matches the SPA's card surface: proto-card bg + hairline border + shadow) */
    .card {
      width: 400px;
      max-width: calc(100vw - 32px);
      background: var(--proto-card);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 30px;
      box-shadow: var(--card-shadow);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .logo {
      font-size: 16px;
      font-weight: 600;
      color: var(--proto-ink);
      letter-spacing: 0.04em;
    }

    .subtitle {
      font-size: 11px;
      color: var(--proto-muted);
      letter-spacing: 0.02em;
      margin-top: 3px;
    }

    /* Language toggle — 1:1 with the SPA left-rail EN/中 segmented control */
    .lang-toggle {
      display: flex;
      flex-shrink: 0;
      border: 1px solid var(--proto-line);
      border-radius: 6px;
      overflow: hidden;
    }

    .lang-opt {
      font-size: 10px;
      font-weight: 600;
      padding: 2.5px 7px;
      cursor: pointer;
      background: transparent;
      color: var(--proto-muted-2);
      border: none;
      transition: background 0.12s, color 0.12s;
    }

    .lang-opt.active {
      background: var(--proto-ink);
      color: var(--proto-card);
    }

    /* Field group */
    .field { margin-bottom: 14px; }

    .label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--proto-muted-2);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input {
      display: block;
      width: 100%;
      background: var(--proto-alt);
      border: 1px solid var(--proto-line);
      border-radius: 6px;
      padding: 9px 11px;
      font-family: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
      font-size: 13px;
      color: var(--proto-ink);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input:focus {
      border-color: var(--proto-accent);
      box-shadow: 0 0 0 3px var(--proto-accent-bg);
    }

    .input::placeholder { color: var(--proto-muted-3); }
    .input:disabled { opacity: 0.5; }

    /* Action row */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 22px;
    }

    .btn {
      flex: 1;
      padding: 9px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-outline {
      flex: 0 0 auto;
      width: 92px;
      background: transparent;
      border-color: var(--proto-line-3);
      color: var(--proto-ink-2);
    }

    .btn-outline:hover:not(:disabled) {
      border-color: var(--proto-muted-3);
      background: var(--proto-alt);
    }

    .btn-primary {
      background: var(--ink-solid-bg);
      color: var(--ink-solid-fg);
    }

    .btn-primary:hover:not(:disabled) { background: var(--ink-solid-hover); }

    /* Status line */
    .status {
      margin-top: 12px;
      font-size: 11px;
      min-height: 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.01em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-ok { color: var(--proto-success); }
    .status-ok .status-dot { background: var(--proto-success); }
    .status-err { color: var(--proto-danger); }
    .status-err .status-dot { background: var(--proto-danger); }
    .status-pending { color: var(--proto-muted); }

    /* ── Chooser: how this app gets a server ── */
    .option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--proto-alt);
      border: 1px solid var(--proto-line);
      border-radius: 8px;
      padding: 13px 15px;
      margin-bottom: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
    }

    .option:hover { border-color: var(--proto-accent); background: var(--proto-accent-bg); }

    .option-title {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--proto-ink);
    }

    .option-desc {
      display: block;
      font-size: 11.5px;
      color: var(--proto-muted);
      margin-top: 3px;
    }

    .option-tag {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--proto-accent);
      border: 1px solid var(--proto-accent);
      border-radius: 4px;
      padding: 0 4px;
      margin-left: 7px;
      vertical-align: 1px;
    }

    .mobile .option { border-radius: 12px; padding: 16px; background: var(--m-card); border-color: var(--m-card-border); }
    .mobile .option-title { font-size: 16px; }
    .mobile .option-desc { font-size: 13px; }

    /* Divider + switch link */
    .divider {
      border: none;
      border-top: 1px solid var(--proto-line);
      margin: 24px 0 18px;
    }

    .switch-row {
      text-align: center;
      font-size: 11px;
      color: var(--proto-muted);
      letter-spacing: 0.01em;
    }

    .switch-row a {
      color: var(--proto-accent);
      text-decoration: none;
      cursor: pointer;
    }

    .switch-row a:hover { text-decoration: underline; }

    /* ── Mobile layout (Android shell: `.mobile` on <html>) ───────────────────────────────────────
     * The desktop centered card becomes a full-bleed, edge-to-edge screen matching the mobile v3
     * shell (scheme-mobile): --m-* surfaces, a big-title header, larger touch targets, 16px inputs
     * (prevents iOS focus-zoom), full-width stacked buttons, and OS-chrome-safe padding via
     * env(safe-area-inset-*). The bottom switch-row is pinned to the bottom of the flex column. */
    .mobile body { display: block; background: var(--m-canvas); }

    .mobile .card {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: var(--m-canvas);
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 22px);
    }

    .mobile .card-head { align-items: center; margin-bottom: 32px; }
    .mobile .logo { font-size: 24px; letter-spacing: 0.02em; }
    .mobile .subtitle { font-size: 13px; margin-top: 5px; color: var(--m-sub); }

    /* Language toggle → mobile segmented control (scheme-mobile MSegmented) */
    .mobile .lang-toggle {
      background: var(--m-hairline);
      border: none;
      border-radius: 8px;
      padding: 2px;
    }
    .mobile .lang-opt {
      font-size: 12px;
      padding: 5px 13px;
      border-radius: 6px;
      color: var(--m-muted);
    }
    .mobile .lang-opt.active {
      background: var(--m-card);
      color: var(--m-ink);
      box-shadow: var(--shadow-segment);
    }

    .mobile .field { margin-bottom: 18px; }
    .mobile .label { font-size: 11px; margin-bottom: 8px; color: var(--m-muted); }

    .mobile .input {
      background: var(--m-card);
      border: 1px solid var(--m-card-border);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 16px; /* ≥16px so iOS/Android does not zoom the viewport on focus */
    }
    .mobile .input:focus {
      border-color: var(--m-run);
      box-shadow: 0 0 0 3px var(--m-run-bg);
    }

    .mobile .actions { flex-direction: column; gap: 10px; margin-top: 26px; }
    .mobile .btn {
      flex: none;
      width: 100%;
      font-size: 15px;
      padding: 14px;
      border-radius: 14px;
    }

    .mobile .status { justify-content: center; margin-top: 16px; font-size: 12px; }

    /* Pin the switch-row to the bottom of the screen; drop the desktop divider. */
    .mobile .divider { display: none; }
    .mobile .switch-row { margin-top: auto; padding-top: 28px; font-size: 12px; color: var(--m-sub); }
    .mobile .switch-row a { color: var(--m-run); }
  </style>
</head>
<body id="cortex-connect-screen">
  <div class="card">
    <div class="card-head">
      <div>
        <div class="logo mono">Cortex</div>
        <div class="subtitle" id="cx-subtitle">Connect to your server</div>
      </div>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button class="lang-opt" id="cx-lang-en" type="button">EN</button>
        <button class="lang-opt" id="cx-lang-zh" type="button">中</button>
      </div>
    </div>

    <div id="cx-chooser" hidden>
      <button class="option" id="cx-opt-local" type="button">
        <span class="option-title"><span id="cx-opt-local-title">Install on this computer</span><span class="option-tag" id="cx-opt-tag">Recommended</span></span>
        <span class="option-desc" id="cx-opt-local-desc"></span>
      </button>
      <button class="option" id="cx-opt-remote" type="button">
        <span class="option-title" id="cx-opt-remote-title">Connect to a remote server</span>
        <span class="option-desc" id="cx-opt-remote-desc"></span>
      </button>
    </div>

    <div id="cx-remote">
    <div class="field">
      <label class="label" id="cx-label-url" for="cx-server-url">Server URL</label>
      <input
        class="input"
        type="url"
        id="cx-server-url"
        placeholder="https://cortex.example.com"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

    <div class="field">
      <label class="label" id="cx-label-token" for="cx-token">Client Token</label>
      <input
        class="input"
        type="password"
        id="cx-token"
        placeholder="••••••••••••••••"
        autocomplete="new-password"
      >
    </div>

    <div class="actions">
      <button class="btn btn-outline" id="cx-btn-test" type="button">Test</button>
      <button class="btn btn-primary" id="cx-btn-connect" type="button">Connect</button>
    </div>

    <div class="status" id="cx-status" aria-live="polite" role="status"></div>

    <hr class="divider">
    <div class="switch-row">
      <span id="cx-switch-prompt">Already connected?</span>
      <a id="cx-link-switch" href="#" role="button">Switch server</a>
    </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Tauri IPC (available via withGlobalTauri: true in tauri.conf.json).
      var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

      var urlInput    = document.getElementById('cx-server-url');
      var tokenInput  = document.getElementById('cx-token');
      var btnTest     = document.getElementById('cx-btn-test');
      var btnConnect  = document.getElementById('cx-btn-connect');
      var statusEl    = document.getElementById('cx-status');
      var linkSwitch  = document.getElementById('cx-link-switch');
      var chooserEl   = document.getElementById('cx-chooser');
      var remoteEl    = document.getElementById('cx-remote');

      // The local option installs and runs a server on this machine — meaningless on the mobile
      // shell, which has no npm and no place to run a Node process, so Android goes straight to the
      // remote form and never sees the chooser.
      var canInstallLocally = !window.__CORTEX_MOBILE__;
      var choosing = canInstallLocally;

      // "Back to the chooser" link, appended to the switch-row only when there is a chooser to go
      // back to.
      var linkBack = document.createElement('a');
      linkBack.href = '#';
      linkBack.setAttribute('role', 'button');

      // ── i18n ──────────────────────────────────────────────────────────────
      // Standalone copy of the SPA's language system: same localStorage key (`cortex.lang`), same
      // en/zh set + default resolution (stored → navigator → en), so toggling here matches the SPA.
      var LANG_KEY = 'cortex.lang';
      var I18N = {
        en: {
          htmlLang: 'en',
          subtitle: 'Connect to your server',
          serverUrl: 'Server URL',
          clientToken: 'Client Token',
          test: 'Test',
          connect: 'Connect',
          testing: 'Testing…',
          connecting: 'Connecting…',
          required: 'Server URL and token required',
          unreachable: function (e) { return 'Unreachable — ' + e; },
          networkError: 'network error',
          unauthorized: '401 Unauthorized — check token',
          ok: function (s) { return 'Connection OK (' + s + ')'; },
          saveFailed: function (e) { return 'Save failed: ' + e; },
          connected: 'Connected — loading workbench…',
          switchPrompt: 'Already connected?',
          switchServer: 'Switch server',
          chooseSubtitle: 'Where should Cortex run?',
          recommended: 'Recommended',
          localTitle: 'Install on this computer',
          localDesc: 'Sets up a Cortex server here and connects to it. Needs Node.js.',
          remoteTitle: 'Connect to a remote server',
          remoteDesc: 'Use a Cortex server already running somewhere else.',
          backToChoice: 'Back',
        },
        zh: {
          htmlLang: 'zh-CN',
          subtitle: '连接到你的服务器',
          serverUrl: '服务器地址',
          clientToken: '客户端令牌',
          test: '测试',
          connect: '连接',
          testing: '测试中…',
          connecting: '连接中…',
          required: '请填写服务器地址和令牌',
          unreachable: function (e) { return '无法连接 — ' + e; },
          networkError: '网络错误',
          unauthorized: '401 未授权 — 请检查令牌',
          ok: function (s) { return '连接正常 (' + s + ')'; },
          saveFailed: function (e) { return '保存失败：' + e; },
          connected: '已连接 — 正在加载工作台…',
          switchPrompt: '已经连接过？',
          switchServer: '切换服务器',
          chooseSubtitle: 'Cortex 运行在哪里？',
          recommended: '推荐',
          localTitle: '在本机安装并启动',
          localDesc: '在这台电脑上安装 Cortex 服务端并连接，需要 Node.js。',
          remoteTitle: '连接到远程服务器',
          remoteDesc: '连接到已经在别处运行的 Cortex 服务端。',
          backToChoice: '返回',
        },
      };

      function resolveInitialLang() {
        var stored = null;
        try { stored = window.localStorage.getItem(LANG_KEY); } catch (e) {}
        if (stored === 'en' || stored === 'zh') return stored;
        var nav = (typeof navigator !== 'undefined' && navigator.language) || '';
        return nav.toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
      }

      var lang = resolveInitialLang();
      var L = I18N[lang];

      // Static text is (re)applied on load + on every toggle. The transient status line keeps whatever
      // it is currently showing (it is re-rendered by its own event with the active-language strings).
      function applyLang() {
        L = I18N[lang];
        document.documentElement.lang = L.htmlLang;
        document.getElementById('cx-subtitle').textContent = choosing ? L.chooseSubtitle : L.subtitle;
        document.getElementById('cx-opt-local-title').textContent = L.localTitle;
        document.getElementById('cx-opt-local-desc').textContent = L.localDesc;
        document.getElementById('cx-opt-remote-title').textContent = L.remoteTitle;
        document.getElementById('cx-opt-remote-desc').textContent = L.remoteDesc;
        document.getElementById('cx-opt-tag').textContent = L.recommended;
        linkBack.textContent = L.backToChoice;
        document.getElementById('cx-label-url').textContent = L.serverUrl;
        document.getElementById('cx-label-token').textContent = L.clientToken;
        btnTest.textContent = L.test;
        btnConnect.textContent = L.connect;
        document.getElementById('cx-switch-prompt').textContent = L.switchPrompt;
        linkSwitch.textContent = L.switchServer;

        document.getElementById('cx-lang-en').classList.toggle('active', lang === 'en');
        document.getElementById('cx-lang-zh').classList.toggle('active', lang === 'zh');
      }

      function setLang(next) {
        if (next !== 'en' && next !== 'zh') return;
        lang = next;
        try { window.localStorage.setItem(LANG_KEY, next); } catch (e) {}
        applyLang();
      }

      document.getElementById('cx-lang-en').addEventListener('click', function () { setLang('en'); });
      document.getElementById('cx-lang-zh').addEventListener('click', function () { setLang('zh'); });

      /** Swap between the chooser and the remote-server form. */
      function showChooser(on) {
        choosing = on && canInstallLocally;
        chooserEl.hidden = !choosing;
        remoteEl.hidden = choosing;
        document.getElementById('cx-subtitle').textContent = choosing ? L.chooseSubtitle : L.subtitle;
      }

      document.getElementById('cx-opt-local').addEventListener('click', function () {
        window.location.href = 'setup.html';
      });
      document.getElementById('cx-opt-remote').addEventListener('click', function () {
        showChooser(false);
        urlInput.focus();
      });
      linkBack.addEventListener('click', function (e) {
        e.preventDefault();
        setStatus('', '');
        showChooser(true);
      });
      if (canInstallLocally) {
        var switchRow = linkSwitch.parentNode;
        switchRow.appendChild(document.createTextNode(' · '));
        switchRow.appendChild(linkBack);
      }

      applyLang();
      showChooser(canInstallLocally);

      // ── Helpers ───────────────────────────────────────────────────────────

      function setStatus(type, text) {
        // type: 'ok' | 'err' | 'pending' | ''
        statusEl.className = 'status' + (type ? ' status-' + type : '');
        statusEl.textContent = '';
        if (type === 'ok' || type === 'err') {
          // Build imperatively — avoids innerHTML with concatenated text.
          var dot = document.createElement('span');
          dot.className = 'status-dot';
          statusEl.appendChild(dot);
          statusEl.appendChild(document.createTextNode(text));
        } else {
          statusEl.textContent = text;
        }
      }

      function setLoading(on) {
        btnTest.disabled    = on;
        btnConnect.disabled = on;
        urlInput.disabled   = on;
        tokenInput.disabled = on;
      }

      function fields() {
        return {
          serverUrl: urlInput.value.trim().replace(/\/+$/, ''),
          token:     tokenInput.value.trim(),
        };
      }

      // ── Connection probe ──────────────────────────────────────────────────
      // GET /trpc with the token header.  Responses:
      //   200 / 400 / 404  → server reached, token accepted
      //   401              → server reached, token rejected
      //   network error    → server unreachable

      async function probe(serverUrl, token) {
        try {
          var res = await fetch(serverUrl + '/trpc', {
            method: 'GET',
            headers: { 'x-cortex-token': token },
            signal: AbortSignal.timeout(8000),
          });
          return { reached: true, ok: res.status !== 401, status: res.status };
        } catch (e) {
          return { reached: false, ok: false, status: 0, error: String(e) };
        }
      }

      // ── Test button ───────────────────────────────────────────────────────

      btnTest.addEventListener('click', async function () {
        var f = fields();
        if (!f.serverUrl || !f.token) {
          setStatus('err', L.required);
          return;
        }
        setLoading(true);
        setStatus('pending', L.testing);
        var r = await probe(f.serverUrl, f.token);
        setLoading(false);
        if (!r.reached) {
          setStatus('err', L.unreachable(r.error || L.networkError));
        } else if (!r.ok) {
          setStatus('err', L.unauthorized);
        } else {
          setStatus('ok', L.ok(r.status));
        }
      });

      // ── Connect button ────────────────────────────────────────────────────

      btnConnect.addEventListener('click', async function () {
        var f = fields();
        if (!f.serverUrl || !f.token) {
          setStatus('err', L.required);
          return;
        }
        setLoading(true);
        setStatus('pending', L.connecting);

        var r = await probe(f.serverUrl, f.token);
        if (!r.reached) {
          setLoading(false);
          setStatus('err', L.unreachable(r.error || L.networkError));
          return;
        }
        if (!r.ok) {
          setLoading(false);
          setStatus('err', L.unauthorized);
          return;
        }

        // Persist via Tauri keychain command.
        if (invoke) {
          try {
            await invoke('connect', { serverUrl: f.serverUrl, token: f.token });
          } catch (e) {
            setLoading(false);
            setStatus('err', L.saveFailed(String(e)));
            return;
          }
        } else {
          // Fallback when running outside Tauri (browser preview).
          window.__CORTEX_DESKTOP_CONFIG = { serverUrl: f.serverUrl, token: f.token };
        }

        setStatus('ok', L.connected);
        setTimeout(function () {
          window.location.href = 'index.html';
        }, 350);
      });

      // ── Switch / disconnect link ───────────────────────────────────────────

      linkSwitch.addEventListener('click', async function (e) {
        e.preventDefault();
        if (invoke) {
          await invoke('disconnect').catch(function () {});
        }
        urlInput.value  = '';
        tokenInput.value = '';
        urlInput.focus();
        setStatus('', '');
      });

      // ── Pre-fill existing credentials (switch-server scenario) ────────────

      if (invoke) {
        invoke('get_connection_config').then(function (cfg) {
          if (cfg && cfg.serverUrl) {
            urlInput.value = cfg.serverUrl;
            // Don't pre-fill token (security); let user re-enter.
          }
        }).catch(function () {});
      }
    }());
  </script>
</body>
</html>
