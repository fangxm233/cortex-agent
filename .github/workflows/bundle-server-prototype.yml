name: Bundled server prototype

on:
  push:
    branches: [cortex/bundle-server]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/cortex/bundle-server'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CORTEX_HOME: /tmp/cortex-bundle-ci/home
      CORTEX_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}')"
      - name: Install and build the package inputs
        run: |
          mkdir -p "$CORTEX_HOME" /tmp/cortex-bundle-ci/os-home /tmp/cortex-bundle-ci/artifacts
          CORTEX_HOME="$CORTEX_HOME" pnpm install --frozen-lockfile
          CORTEX_HOME="$CORTEX_HOME" pnpm --filter @cortex-agent/server build
          CORTEX_HOME="$CORTEX_HOME" pnpm --filter @cortex-agent/web bundle
      - name: Stage and pack the opt-in bundled variant
        run: |
          node --test agent-server/scripts/bundle-prune-browser.test.mjs
          CORTEX_HOME="$CORTEX_HOME" node agent-server/scripts/bundle.mjs /tmp/cortex-bundle-ci/stage
          cd /tmp/cortex-bundle-ci/stage
          CORTEX_HOME="$CORTEX_HOME" npm pack --ignore-scripts --pack-destination /tmp/cortex-bundle-ci/artifacts --json > /tmp/cortex-bundle-ci/pack.json
      - name: Install and initialize without credentials
        run: |
          export HOME=/tmp/cortex-bundle-ci/os-home
          CORTEX_HOME="$CORTEX_HOME" npm install -g --prefix /tmp/cortex-bundle-ci/prefix /tmp/cortex-bundle-ci/artifacts/*.tgz --foreground-scripts
          /tmp/cortex-bundle-ci/prefix/bin/cortex init </dev/null
      - name: Exercise the installed package
        run: |
          env -i PATH="$PATH" HOME=/tmp/cortex-bundle-ci/os-home CORTEX_HOME="$CORTEX_HOME" \
            node agent-server/scripts/bundle-smoke.mjs /tmp/cortex-bundle-ci/prefix
          du -sk /tmp/cortex-bundle-ci/prefix/lib/node_modules/@cortex-agent/server > /tmp/cortex-bundle-ci/installed-size.txt
          ls -l /tmp/cortex-bundle-ci/prefix/lib/node_modules/@cortex-agent/server/node_modules/agent-browser/bin
      - name: Keep smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-smoke-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            /tmp/cortex-bundle-ci/smoke
            /tmp/cortex-bundle-ci/pack.json
            /tmp/cortex-bundle-ci/installed-size.txt
            /tmp/cortex-bundle-ci/home/logs
          if-no-files-found: warn
          retention-days: 7
