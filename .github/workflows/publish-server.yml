name: Publish @cortex-agent/server

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server, UI contract, and Web SPA
        run: pnpm --filter '@cortex-agent/web...' run build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1

      - name: Publish package
        working-directory: agent-server
        run: npm publish --access public
