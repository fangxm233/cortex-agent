name: Publish @cortex-agent/server

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CORTEX_HOME: /tmp/cortex-bundle-release/home
      CORTEX_TELEMETRY: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4   # version comes from package.json `packageManager`

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: CORTEX_HOME="$CORTEX_HOME" pnpm install --frozen-lockfile

      - name: Build server, UI contract, and Web SPA
        run: CORTEX_HOME="$CORTEX_HOME" pnpm --filter '@cortex-agent/web...' run build

      - name: Record the telemetry endpoint in the build
        working-directory: agent-server
        # Source builds have no build-info.json and never send telemetry; an unset variable here
        # ships a release that does not send either.
        env:
          TELEMETRY_ENDPOINT: ${{ vars.CORTEX_TELEMETRY_ENDPOINT }}
        run: >-
          node -e "require('fs').writeFileSync('dist/build-info.json',
          JSON.stringify({ telemetryEndpoint: process.env.TELEMETRY_ENDPOINT || null }) + '\n')"

      - name: Move the Web source maps out of the package
        # Vite emits hidden source maps (no sourceMappingURL). They go to the GitHub release for
        # crash-stack symbolication and are deleted before the SPA is staged into the npm package.
        shell: bash
        # The archive goes outside the checkout: client-bundle.js requires a clean worktree.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./agent-server/package.json').version")
          OUT="$RUNNER_TEMP/release-sourcemaps"
          mkdir -p "$OUT"
          (cd web/dist && find . -name '*.map' -printf '%P\n' | sort) > "$OUT/maps.txt"
          test -s "$OUT/maps.txt"
          tar -czf "$OUT/web-sourcemaps-$VERSION.tgz" -C web/dist -T "$OUT/maps.txt"
          rm "$OUT/maps.txt"
          find web/dist -name '*.map' -delete

      - name: Keep the source maps for the release
        uses: actions/upload-artifact@v4
        with:
          name: web-sourcemaps
          path: ${{ runner.temp }}/release-sourcemaps/*.tgz
          if-no-files-found: error

      - name: Stage and pack the release bundle
        run: |
          node --test agent-server/scripts/bundle-prune-browser.test.mjs agent-server/scripts/bundle-notices.test.mjs
          node agent-server/scripts/client-bundle.js
          CORTEX_HOME="$CORTEX_HOME" node agent-server/scripts/bundle.mjs "/tmp/cortex-bundle-release/stage"
          mkdir -p "/tmp/cortex-bundle-release/artifacts"
          cd "/tmp/cortex-bundle-release/stage"
          CORTEX_HOME="$CORTEX_HOME" npm pack --ignore-scripts --pack-destination "/tmp/cortex-bundle-release/artifacts" --json > ../pack.json
          TARBALL=$(node -p "require('../pack.json')[0].filename")
          echo "BUNDLE_TARBALL=/tmp/cortex-bundle-release/artifacts/$TARBALL" >> "$GITHUB_ENV"

      - name: Smoke test the exact tarball before publishing
        run: |
          export HOME="/tmp/cortex-bundle-release/os-home"
          mkdir -p "$HOME" "$CORTEX_HOME/data"
          CORTEX_HOME="$CORTEX_HOME" npm install -g --prefix "/tmp/cortex-bundle-release/prefix" "$BUNDLE_TARBALL" --foreground-scripts
          "/tmp/cortex-bundle-release/prefix/bin/cortex" init </dev/null
          env -i PATH="$PATH" HOME="$HOME" CORTEX_HOME="$CORTEX_HOME" \
            node agent-server/scripts/bundle-smoke.mjs "/tmp/cortex-bundle-release/prefix"

      - name: Keep installed-package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-bundle-smoke
          path: |
            /tmp/cortex-bundle-release/smoke
            /tmp/cortex-bundle-release/pack.json
          if-no-files-found: warn

      - name: Upgrade npm for trusted publishing
        run: CORTEX_HOME="$CORTEX_HOME" npm install -g npm@latest   # OIDC needs npm >= 11.5.1

      - name: Publish the smoke-tested tarball
        # CalVer same-day suffixes are semver prereleases, so latest must be explicit.
        # The tarball has no prepare/prepack lifecycle; publish exactly what passed smoke.
        run: npm publish "$BUNDLE_TARBALL" --access public --tag latest --ignore-scripts

  attach-sourcemaps:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REL_TAG: ${{ github.ref_name }}
    steps:
      - name: Download the source maps
        uses: actions/download-artifact@v4
        with:
          name: web-sourcemaps
          path: upload

      - name: Wait for the release to exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The release is created by hand, with its notes, after the tag is pushed (the native
          # installers wait for it the same way). Give that up to 30 minutes.
          for _ in $(seq 1 60); do
            if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::No release for $REL_TAG after 30 minutes. Create it, then re-run this job to attach the source maps."
          exit 1

      - name: Attach the source maps to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$REL_TAG" upload/web-sourcemaps-*.tgz --repo "$GITHUB_REPOSITORY" --clobber
