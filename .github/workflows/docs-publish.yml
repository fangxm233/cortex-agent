name: Publish Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material mkdocs-static-i18n

      - name: Build site
        run: mkdocs build

      - name: Reject positional Chinese heading anchors
        run: |
          if grep -RIn 'id="_[0-9]' site/zh/; then
            echo '::error::Found positional Chinese heading anchors; add explicit {#slug} attributes to the listed headings.'
            exit 1
          else
            grep_status=$?
            if [ "$grep_status" -ne 1 ]; then
              exit "$grep_status"
            fi
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          commit_message: "docs: deploy from ${{ github.sha }}"
          force_orphan: true
