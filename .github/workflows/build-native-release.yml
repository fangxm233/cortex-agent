name: Build native release assets

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing server-v* tag to build
        required: true
      attach:
        description: Attach the installers to that tag's release
        type: boolean
        default: false
      source:
        description: Branch or commit to build instead of the tag (artifacts only, never attached)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # A tag push builds its own tag; a manual run builds the tag it was given.
  REL_TAG: ${{ inputs.tag || github.ref_name }}

# Every platform job checks out the tag (or the dispatched `source`), then runs the shared setup
# (version check, install, SPA build) from main rather than from ./: a dispatched rebuild takes this
# workflow from main and the source from the tag, and the setup has to follow the workflow so
# CI-only fixes reach old tags. Each desktop build first stages the runtime it ships
# (desktop/scripts/fetch-bundled-runtime.mjs), cached across runs.

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || inputs.tag || github.ref_name }}

      - name: Set up workspace
        uses: fangxm233/cortex-agent/.github/actions/setup-workspace@main
        with:
          tag: ${{ env.REL_TAG }}

      - name: Cache bundled runtime downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/cortex-bundled-runtime
          key: bundled-runtime-x86_64-pc-windows-msvc-${{ hashFiles('desktop/scripts/fetch-bundled-runtime.mjs') }}

      - name: Build Windows installer
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc
          node desktop/scripts/fetch-bundled-runtime.mjs --target x86_64-pc-windows-msvc
          pnpm --dir desktop exec tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Verify and stage Windows installer
        shell: pwsh
        run: |
          $bundle = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(Get-ChildItem $bundle -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "expected one NSIS installer, found $($installers.Count)" }
          $binary = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/cortex-desktop.exe"
          $productVersion = (Get-Item $binary).VersionInfo.ProductVersion
          if ($productVersion -ne $env:VERSION) { throw "binary version $productVersion != $env:VERSION" }
          $sig = Get-AuthenticodeSignature $installers[0].FullName
          if ($sig.Status -notin @('Valid', 'NotSigned')) { throw "installer signature status: $($sig.Status)" }
          Write-Host "installer signature status: $($sig.Status)"
          $listing = & 7z l $installers[0].FullName | Out-String
          foreach ($file in @('manifest.json', 'node-v24.21.0-win-x64.zip', 'git-2.56.0.2-x64.7z')) {
            if ($listing -notmatch "runtime[\\/]$([regex]::Escape($file))") { throw "installer is missing runtime/$file" }
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $dest = "release-assets/Cortex-$env:VERSION-Windows-x86_64-setup.exe"
          Copy-Item $installers[0].FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $dest -Leaf)" | Set-Content -NoNewline release-assets/SHA256SUMS-Windows.txt

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            lipo: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
            lipo: x86_64
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || inputs.tag || github.ref_name }}

      - name: Set up workspace
        uses: fangxm233/cortex-agent/.github/actions/setup-workspace@main
        with:
          tag: ${{ env.REL_TAG }}

      - name: Cache bundled runtime downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/cortex-bundled-runtime
          key: bundled-runtime-${{ matrix.target }}-${{ hashFiles('desktop/scripts/fetch-bundled-runtime.mjs') }}

      - name: Build macOS disk image
        run: |
          rustup target add ${{ matrix.target }}
          node desktop/scripts/fetch-bundled-runtime.mjs --target ${{ matrix.target }}
          pnpm --dir desktop exec tauri build --target ${{ matrix.target }} --bundles dmg -- --locked

      - name: Verify and stage macOS disk image
        shell: bash
        run: |
          set -euo pipefail
          bundle=desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg
          images=("$bundle"/*.dmg)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          mountpoint=$(mktemp -d)
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          app=$(find "$mountpoint" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$actual" = "$VERSION"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = "${{ matrix.lipo }}"
          runtime="$app/Contents/Resources/runtime"
          node=$(sed -n 's/.*"archive": "\(node-[^"]*\)".*/\1/p' "$runtime/manifest.json")
          case "${{ matrix.lipo }}" in arm64) [[ "$node" == *darwin-arm64* ]] ;; *) [[ "$node" == *darwin-x64* ]] ;; esac
          test -f "$runtime/$node"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil detach "$mountpoint"
          trap - EXIT
          mkdir -p release-assets
          dest="release-assets/Cortex-$VERSION-macOS-${{ matrix.arch }}.dmg"
          cp "${images[0]}" "$dest"
          shasum -a 256 "$dest" | sed 's#  release-assets/#  #' > "release-assets/SHA256SUMS-macOS-${{ matrix.arch }}.txt"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-macOS-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || inputs.tag || github.ref_name }}

      - name: Set up workspace
        uses: fangxm233/cortex-agent/.github/actions/setup-workspace@main
        with:
          tag: ${{ env.REL_TAG }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf \
            rpm

      - name: Cache bundled runtime downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/cortex-bundled-runtime
          key: bundled-runtime-x86_64-unknown-linux-gnu-${{ hashFiles('desktop/scripts/fetch-bundled-runtime.mjs') }}

      - name: Build Linux bundles
        run: |
          node desktop/scripts/fetch-bundled-runtime.mjs --target x86_64-unknown-linux-gnu
          pnpm --dir desktop exec tauri build --bundles deb,appimage,rpm -- --locked

      - name: Verify and stage Linux bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle=desktop/src-tauri/target/release/bundle
          binary=desktop/src-tauri/target/release/cortex-desktop
          test -x "$binary"
          mkdir -p release-assets

          pick() {
            local dir="$1" pattern="$2" dest="$3"
            local matches=("$dir"/$pattern)
            test "${#matches[@]}" -eq 1 || { echo "expected one $pattern in $dir, found ${#matches[@]}" >&2; exit 1; }
            test -f "${matches[0]}"
            # every bundler stamps the version into the file name; refuse a stale artifact
            [[ "$(basename "${matches[0]}")" == *"$VERSION"* ]] || { echo "version missing from ${matches[0]}" >&2; exit 1; }
            cp "${matches[0]}" "release-assets/$dest"
          }

          pick "$bundle/deb"      "*.deb"      "Cortex-$VERSION-Linux-amd64.deb"
          pick "$bundle/appimage" "*.AppImage" "Cortex-$VERSION-Linux-x86_64.AppImage"
          pick "$bundle/rpm"      "*.rpm"      "Cortex-$VERSION-Linux-x86_64.rpm"

          chmod +x "release-assets/Cortex-$VERSION-Linux-x86_64.AppImage"
          runtime=node-v24.21.0-linux-x64.tar.gz
          dpkg-deb -c "release-assets/Cortex-$VERSION-Linux-amd64.deb" | grep -q "runtime/$runtime"
          rpm -qlp "release-assets/Cortex-$VERSION-Linux-x86_64.rpm" | grep -q "runtime/$runtime"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/release-assets/Cortex-$VERSION-Linux-x86_64.AppImage" --appimage-extract >/dev/null)
          find "$RUNNER_TEMP/squashfs-root" -path "*/runtime/$runtime" | grep -q .
          (cd release-assets && sha256sum ./*.deb ./*.AppImage ./*.rpm | sed 's#\./##' > SHA256SUMS-Linux.txt)
          cat release-assets/SHA256SUMS-Linux.txt

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Linux-x86_64
          path: release-assets/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    # The release keystore is only present when the four ANDROID_* secrets are set.
    # Without them the job is skipped rather than producing an unsignable or
    # differently-signed APK that existing installs could not upgrade over.
    if: ${{ vars.BUILD_ANDROID == 'true' }}
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source || inputs.tag || github.ref_name }}

      - name: Set up workspace
        uses: fangxm233/cortex-agent/.github/actions/setup-workspace@main
        with:
          tag: ${{ env.REL_TAG }}
          build-web: false

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to `tools platform-tools`, and the legacy `tools`
          # package no longer exists in the SDK repository: sdkmanager exits 1 on
          # "Failed to find package 'tools'" and takes the whole job with it. The
          # next step installs everything this build actually needs anyway.
          packages: platform-tools

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "build-tools;37.0.0" "platforms;android-37.0" "platforms;android-36" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Stage keystore and toolchain config
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is not set}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is not set}"
          : "${ANDROID_STORE_PASS:?ANDROID_STORE_PASS secret is not set}"
          : "${ANDROID_KEY_PASS:?ANDROID_KEY_PASS secret is not set}"
          secrets_dir="$RUNNER_TEMP/android"
          mkdir -p "$secrets_dir"
          chmod 700 "$secrets_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$secrets_dir/release.keystore"
          test -s "$secrets_dir/release.keystore"
          # desktop/scripts/android-release.sh sources this file; it is the same shape as the
          # local ~/.cortex/config/android-release.env, with CI's toolchain paths filled in.
          umask 077
          # ${var@Q} shell-quotes each value: a password may carry $, ", \\ or a space,
          # and the script sources this file rather than parsing it.
          keystore_path="$secrets_dir/release.keystore"
          {
            printf 'JAVA_HOME=%s\n' "${JAVA_HOME@Q}"
            printf 'ANDROID_HOME=%s\n' "${ANDROID_HOME@Q}"
            printf 'NDK_HOME=%s\n' "${NDK_HOME@Q}"
            printf 'CORTEX_ANDROID_KEYSTORE=%s\n' "${keystore_path@Q}"
            printf 'CORTEX_ANDROID_KEY_ALIAS=%s\n' "${ANDROID_KEY_ALIAS@Q}"
            printf 'CORTEX_ANDROID_STORE_PASS=%s\n' "${ANDROID_STORE_PASS@Q}"
            printf 'CORTEX_ANDROID_KEY_PASS=%s\n' "${ANDROID_KEY_PASS@Q}"
          } > "$secrets_dir/android-release.env"
          echo "CORTEX_ANDROID_ENV=$secrets_dir/android-release.env" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        run: bash desktop/scripts/android-release.sh --target aarch64

      - name: Verify and stage Android APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk' -print | head -1)
          test -n "$apk"
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          name=$("$aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test "$name" = "$VERSION" || { echo "apk versionName $name != $VERSION" >&2; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          mkdir -p release-assets
          cp "$apk" "release-assets/Cortex-$VERSION-Android-arm64.apk"
          (cd release-assets && sha256sum ./*.apk | sed 's#\./##' > SHA256SUMS-Android.txt)
          cat release-assets/SHA256SUMS-Android.txt

      - name: Upload Android asset
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-Android-arm64
          path: release-assets/*
          if-no-files-found: error

  attach:
    needs: [windows, macos, linux, android]
    # android is conditional; attach whatever the platforms that ran produced,
    # but never on a platform that actually failed.
    if: >-
      ${{ always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && (github.event_name == 'push' || (inputs.attach && !inputs.source)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${REL_TAG#server-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p upload
          # The per-platform SHA256SUMS-*.txt fragments stay out of the release; the
          # digests go to the job summary instead, for the release notes.
          find artifacts -type f ! -name 'SHA256SUMS-*.txt' -exec cp {} upload/ \;
          test -n "$(ls -A upload)"
          {
            echo "### Installers for \`$REL_TAG\`"
            echo
            echo '| file | SHA-256 |'
            echo '|---|---|'
            (cd upload && sha256sum ./* | sed 's#\./##') |
              while read -r digest name; do echo "| \`$name\` | \`$digest\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Wait for the release to exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The release is created by hand, with its notes, after the tag is pushed.
          # Give that up to 30 minutes rather than inventing a release with an empty body.
          for _ in $(seq 1 60); do
            if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::No release for $REL_TAG after 30 minutes. Create it, then re-run this job to attach the installers."
          exit 1

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$REL_TAG" upload/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[] | .name + "  " + (.size|tostring) + " bytes"'
