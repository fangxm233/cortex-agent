name: Publish @cortex-agent/client

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1

      - name: Publish package
        # --tag latest is required, not cosmetic: CalVer same-day re-releases use a YYYY.M.D-N
        # suffix, which semver classifies as a prerelease. npm >= 11 refuses to publish one
        # without an explicit tag, and the step above always pulls the newest npm. For a plain
        # YYYY.M.D version this is exactly npm's default behaviour.
        run: npm publish --access public --tag latest
