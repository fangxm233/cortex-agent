name: Publish @cortex-agent/client

on:
  push:
    tags:
      - "client-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4   # version comes from package.json `packageManager`

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile --filter @cortex-agent/client

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1

      - name: Publish package
        working-directory: client
        # prepare copies the root README in, compiles and bundles dist/client.mjs.
        # --tag latest is required, not cosmetic: CalVer same-day re-releases use a YYYY.M.D-N
        # suffix, which semver classifies as a prerelease. npm >= 11 refuses to publish one
        # without an explicit tag, and the step above always pulls the newest npm. For a plain
        # YYYY.M.D version this is exactly npm's default behaviour.
        run: npm publish --access public --tag latest
