[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cortex-bench-harness"
version = "0.1.0"
description = "Harbor adapter for reproducible Cortex benchmark runs"
requires-python = ">=3.12"
dependencies = [
  "harbor==0.20.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_bench_harness"]

[tool.pytest.ini_options]
testpaths = ["tests/package"]
pythonpath = ["src"]
