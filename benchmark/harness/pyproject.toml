[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cortex-bench-harness"
version = "0.1.0"
description = "Harbor adapter for reproducible Cortex benchmark runs"
requires-python = ">=3.12"
dependencies = [
  "harbor==0.20.0",
  "zstandard==0.25.0",
]

[project.scripts]
cortex-bench = "cortex_bench_harness.campaign:main"
cortex-bench-deepseek-smoke = "cortex_bench_harness.launcher.deepseek_paid_smoke_launcher:main"

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_bench_harness"]

[tool.pytest.ini_options]
testpaths = ["tests/launcher", "tests/package", "tests/proxy", "tests/scan"]
pythonpath = ["src", "tests"]
