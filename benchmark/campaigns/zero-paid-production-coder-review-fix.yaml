# input:  one committed production coder-review reviewer-fix ZERO-PAID trial
# output: one production webhook/exporter trial over the coder-then-fixer template
# pos:    Committed single-trial production reviewer-fix recording campaign
# >>> If I am updated, update my header and folder CORTEX.md <<<
#
# The second coder-review variant beside zero-paid-production-coder-review.yaml. Everything outside
# the arm is the same committed trial: same task fixture, same sealed proxy policy, same
# digest-pinned image, same loopback synthetic upstream on port 9099. The arm alone differs, and
# what it changes is the committed bundle the launcher materializes --
# coder-review-reviewer-fix-pi-deepseek, whose root template is coder-review-fix over the coder and
# fixer agents: the coder implements, then an independent fixer audits
# and repairs blockers in the same writable workspace. The operator starts the committed synthetic
# DeepSeek upstream and builds the two RUN-LOCAL artifacts named below before launch. No provider
# endpoint or real credential is used; paid remains false.

schema_version: cortex-bench-campaign/1
campaign: zp-reviewer-fix-record
paid: false
trials_dir: /var/tmp/cortex-bench/zp-reviewer-fix-record
cli_version: "2026.8.6"

manifest:
  wheel_path: ../harness/dist/cortex_bench_harness-0.1.0-py3-none-any.whl
  npm_artifact_path: ../harness/dist/cortex-agent-server-2026.8.6.tgz
  lockfile_path: ../harness/uv.lock
  lockfile_manifest_path: benchmark/harness/uv.lock

credential:
  upstream_base_url: http://127.0.0.1:9099
  route_identity_host: api.deepseek.com
  proxy_host_suffix: proxy.invalid
  dummy_token_ref: zero-paid-dummy-token

host_scan_policy:
  secret_environment:
    provider_credential: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  forbidden_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN
  forbidden_argv_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN_ARGV
  repository_checkout_environment: CORTEX_BENCH_ZERO_PAID_CHECKOUT
  host_identity_environment:
    machine: CORTEX_BENCH_ZERO_PAID_IDENTITY

docker_network:
  subnet_pool: 172.30.240.0/20
  subnet_prefix: 24

proxy:
  credential_env: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  request_body_limit_bytes: 16777216
  response_body_limit_bytes: 16777216
  listen_host: 0.0.0.0

arms:
  # Declared exactly as launcher/production_arms.py states this bundle: any drift and the launcher
  # refuses the arm rather than running it on some other arm's bundle.
  - name: zp-pi-coder-reviewer-fix
    kind: cortex
    backend: pi
    provider: deepseek
    model: deepseek-v4-flash
    credential_capability: pi-deepseek-api-key
    orchestration:
      mode: coder-review
      coder_review_variant: reviewer-fix
      ask_manager: false
    limits:
      # Two template steps, each an agent turn with its own tool loop: half the audit-retry arm's
      # four-step request budget, cost cap and deadline.
      max_provider_requests: 200
      max_cost_usd: "2.00"
      deadline_seconds: 1800
      max_output_tokens: 65536

# THE NETWORK THIS CAMPAIGN SCORES ON
#
# `open` means the trial container reaches the internet. This is stated here rather than left to
# the default because it decides whether a score measures the agent or measures its ability to
# look the answer up: the Terminal-Bench 2.1 tasks and their reference solutions are in a public
# repository, and an open trial can fetch them. Scores from this campaign are NOT comparable with
# any recorded before 2026-08-18, which all ran proxy-only.
#
# To get a score that measures capability, switch to the filtered mode and declare what may be
# reached. An empty `filtered` block is the proxy-only shape every earlier benchmark ran under:
#
#   network:
#     mode: filtered          # credential route only -- nothing else is reachable
#
# `allowlist` widens it (gost enforces it, and the trial's own proxy host is added automatically).
# `denylist` is best-effort ONLY: it is a set of addresses resolved once on the host at admission,
# so DNS rotation, CDN re-mapping and direct-to-IP connections defeat it. It keeps an honest agent
# off a host; it does not keep a determined one off.
network:
  mode: open

tasks:
  - task_id: zero-paid-one
    path: tasks/zero-paid-one
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55

comparisons: []
