# input:  the ZERO-PAID campaign that proves concurrent trials on one host
# output: three trials run two at a time across two address slots, and one comparison report
# pos:    Committed ZERO-PAID concurrency campaign
# >>> If I am updated, update my header and folder CORTEX.md <<<
#
# Same ZERO-PAID contract as `zero-paid-dry-run.yaml` — `paid: false`, a loopback-only synthetic
# upstream, no provider endpoint and no real credential — and the same RUN-LOCAL values, prepared
# the same way. Read that file's header first; only the purpose differs.
#
# What this campaign proves, which no unit test can: the parts of concurrency that only exist on a
# real host.
#
#   * Two Docker networks on non-overlapping subnets exist at once. A second network on the single
#     literal every earlier campaign declared would simply be refused by Docker.
#   * Two credential routes are live at once, each bound to its own container address, each with
#     its own ephemeral port, its own reservation budget, its own audit log and its own proof of
#     revocation.
#   * The container address is DECLARED, not predicted: the compose overlay pins the sidecar to
#     its slot's `.2`, and admission refuses the trial unless the armed route's source binding is
#     that same address. If Docker Compose rejected `ipv4_address` on an external network, every
#     trial here would fail closed rather than a paid one discovering it.
#   * A slot is reusable: three trials over two slots means the third takes a slot whose network
#     was created, used and removed, on a subnet that must therefore be free again.
#   * Nothing crosses between concurrent trials — each trial's artifacts, scan and finalization
#     see only its own root, and each envelope reconciles only its own traffic.
#
# `zero-paid-refused` is included because a failing trial and a succeeding one running side by
# side is the case worth proving: the failure must not disturb its neighbour, and the campaign
# must still finish. Which trials share a wave is visible afterwards in the result document's
# per-trial `slot`, `started_at` and `finished_at`.

schema_version: cortex-bench-campaign/1
campaign: zero-paid-parallel
paid: false
trials_dir: /var/tmp/cortex-bench/zero-paid-parallel
# Labels the runs in the comparison report; keep it equal to the bundle actually installed.
cli_version: "2026.8.6"

# Three trials, two slots: enough to prove both simultaneity and slot reuse in one run.
concurrency: 2

manifest:
  # RUN-LOCAL: both artefacts are build outputs and are not committed.
  wheel_path: ../harness/dist/cortex_bench_harness-0.1.0-py3-none-any.whl
  npm_artifact_path: ../harness/dist/cortex-agent-server-2026.8.6.tgz
  lockfile_path: ../harness/uv.lock
  lockfile_manifest_path: benchmark/harness/uv.lock

credential:
  # RUN-LOCAL: the synthetic upstream. A ZERO-PAID run must never name a provider or a gateway.
  upstream_base_url: http://127.0.0.1:9099
  route_identity_host: api.deepseek.com
  proxy_host_suffix: proxy.invalid
  dummy_token_ref: zero-paid-dummy-token

host_scan_policy:
  secret_environment:
    provider_credential: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  forbidden_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN
  forbidden_argv_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN_ARGV
  repository_checkout_environment: CORTEX_BENCH_ZERO_PAID_CHECKOUT
  host_identity_environment:
    machine: CORTEX_BENCH_ZERO_PAID_IDENTITY

# Slot 0 is 172.30.240.0/24 (.1 gateway, .2 container) — the address space every committed run so
# far used. Slot 1 is 172.30.241.0/24. Nothing on the intended host routes 172.30.0.0/16.
docker_network:
  subnet_pool: 172.30.240.0/20
  subnet_prefix: 24

proxy:
  # The synthetic credential is named, never carried; the host reads this variable.
  credential_env: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  request_body_limit_bytes: 16777216
  response_body_limit_bytes: 16777216
  # The container reaches the route, so the listener is bound for it and advertised by admission.
  listen_host: 0.0.0.0

arms:
  - name: zero-paid-pi-direct
    kind: cortex
    backend: pi
    provider: deepseek
    model: deepseek-v4-flash
    credential_capability: pi-deepseek-api-key
    orchestration:
      mode: direct
      ask_manager: false
    limits:
      max_thread_starts: 0
      max_parent_questions: 0
      max_task_depth: 0
      max_tasks: 0
      max_provider_requests: 200
      max_resident_agent_processes: 1
      max_cost_usd: "2.00"
      deadline_seconds: 1800
      max_output_tokens: 65536

tasks:
  - task_id: zero-paid-one
    path: tasks/zero-paid-one
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55
  - task_id: zero-paid-refused
    path: tasks/zero-paid-refused
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55
  - task_id: zero-paid-two
    path: tasks/zero-paid-two
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55

comparisons: []
