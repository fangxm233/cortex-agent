# input:  the ZERO-PAID campaign that proves a failed agent is a result, not a stop
# output: one non-admitted trial with an authentic verifier reward, then a normal trial
# pos:    Committed ZERO-PAID failed-agent campaign
# >>> If I am updated, update my header and folder CORTEX.md <<<
#
# Same ZERO-PAID contract as `zero-paid-dry-run.yaml` — `paid: false`, a loopback-only synthetic
# upstream, no provider endpoint and no real credential — and the same RUN-LOCAL values,
# prepared the same way. Read that file's header first; only the purpose differs.
#
# What this campaign proves, which the dry run cannot: a trial whose inner agent run ends in a
# terminal state other than `completed`/`ok` is finalized, published with a `grader_admission`
# that says it must not be graded, scored by the authentic Terminal-Bench verifier on whatever it
# actually left behind, and followed by the next trial instead of ending the campaign.
#
# `zero-paid-refused` induces that without faking anything. Its instruction is deliberately
# outside the shape `synthetic_deepseek` recognizes, so the synthetic model answers 400 to every
# request; the inner run exhausts the backend's retries and terminates `failed`/`provider_error`.
# Nothing writes `/tmp/answer.txt`, so the task's own verifier — the same script shape as every
# other ZERO-PAID task — reads no answer and scores 0. That 0 is a measurement, not a convention.
#
# It runs FIRST on purpose: a campaign that stops at its first failed agent cannot reach the
# second task, so `zero-paid-one` finishing with reward 1 is the evidence of continuation.

schema_version: cortex-bench-campaign/1
campaign: zero-paid-failed-agent
paid: false
trials_dir: /var/tmp/cortex-bench/zero-paid-failed-agent
# Labels the runs in the comparison report; keep it equal to the bundle actually installed.
cli_version: "2026.8.6"

manifest:
  # RUN-LOCAL: both artefacts are build outputs and are not committed.
  wheel_path: ../harness/dist/cortex_bench_harness-0.1.0-py3-none-any.whl
  npm_artifact_path: ../harness/dist/cortex-agent-server-2026.8.6.tgz
  lockfile_path: ../harness/uv.lock
  lockfile_manifest_path: benchmark/harness/uv.lock

credential:
  # RUN-LOCAL: the synthetic upstream. A ZERO-PAID run must never name a provider or a gateway.
  upstream_base_url: http://127.0.0.1:9099
  route_identity_host: api.deepseek.com
  proxy_host_suffix: proxy.invalid
  dummy_token_ref: zero-paid-dummy-token

host_scan_policy:
  secret_environment:
    provider_credential: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  forbidden_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN
  forbidden_argv_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN_ARGV
  repository_checkout_environment: CORTEX_BENCH_ZERO_PAID_CHECKOUT
  host_identity_environment:
    machine: CORTEX_BENCH_ZERO_PAID_IDENTITY

# The address space concurrent trials are carved out of. Slot k takes the k-th /24, its gateway
# is .1 and its container is .2; slot 0 is the 172.30.240.0/24 every committed run so far used.
docker_network:
  subnet_pool: 172.30.240.0/20
  subnet_prefix: 24

proxy:
  # The synthetic credential is named, never carried; the host reads this variable.
  credential_env: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  max_request_cost_usd: "0.01"
  input_cost_per_million_usd: "0.14"
  output_cost_per_million_usd: "0.28"
  request_body_limit_bytes: 16777216
  response_body_limit_bytes: 16777216
  # The container reaches the route, so the listener is bound for it and advertised by admission.
  listen_host: 0.0.0.0

arms:
  - name: zero-paid-pi-direct
    kind: cortex
    backend: pi
    provider: deepseek
    model: deepseek-v4-flash
    credential_capability: pi-deepseek-api-key
    orchestration:
      mode: direct
      ask_manager: false
    limits:
      max_thread_starts: 0
      max_parent_questions: 0
      max_task_depth: 0
      max_tasks: 0
      max_provider_requests: 200
      max_resident_agent_processes: 1
      max_cost_usd: "2.00"
      deadline_seconds: 1800
      max_output_tokens: 32768

tasks:
  - task_id: zero-paid-refused
    path: tasks/zero-paid-refused
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55
  - task_id: zero-paid-one
    path: tasks/zero-paid-one
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55

comparisons: []
