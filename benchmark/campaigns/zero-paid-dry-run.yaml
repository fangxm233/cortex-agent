# input:  the ZERO-PAID campaign the public runner is proven against
# output: two trials on a synthetic upstream, and one comparison report
# pos:    Committed neutral ZERO-PAID campaign
# >>> If I am updated, update my header and folder CORTEX.md <<<
#
# ZERO-PAID means no paid-provider request: `paid: false`, a loopback-only synthetic upstream,
# no provider endpoint and no real credential. `proxy_usage.cost_usd` still applies the declared
# token prices to synthetic traffic as deterministic accounting; it is not provider spend.
#
# Two groups of values are RUN-LOCAL and must be confirmed before a dry run, because no committed
# document can know them: the build artefacts under `manifest` (produce them from the repository
# root with `benchmark/harness/scripts/build-wheel.sh` and
# `mkdir -p benchmark/harness/dist && (cd agent-server && npm pack
# --pack-destination ../benchmark/harness/dist)`), and `credential.upstream_base_url`, which must
# point at the synthetic upstream the operator started. Build the pinned task runtime with
# `benchmark/harness/scripts/build-zero-paid-runtime-image.sh`. Every other value is committed.
#
# The campaign runs one arm over two tasks. Add a second arm plus a `comparisons:` entry to
# contrast two arms; both arms then share this one credential route, so they must name the same
# provider.

schema_version: cortex-bench-campaign/1
campaign: zero-paid-dry-run
paid: false
trials_dir: /var/tmp/cortex-bench/zero-paid-dry-run
# Labels the runs in the comparison report; keep it equal to the bundle actually installed.
cli_version: "2026.8.6"

manifest:
  # RUN-LOCAL: both artefacts are build outputs and are not committed.
  wheel_path: ../harness/dist/cortex_bench_harness-0.1.0-py3-none-any.whl
  npm_artifact_path: ../harness/dist/cortex-agent-server-2026.8.6.tgz
  lockfile_path: ../harness/uv.lock
  lockfile_manifest_path: benchmark/harness/uv.lock

credential:
  # RUN-LOCAL: the synthetic upstream. A ZERO-PAID run must never name a provider or a gateway.
  upstream_base_url: http://127.0.0.1:9099
  route_identity_host: api.deepseek.com
  # Each trial gets its OWN route at `http://<trial-id>.<proxy_host_suffix>`, because admission
  # refuses any proxy hostname whose first label is not that trial's id. RUN-LOCAL: the container
  # has to resolve that name to the host route, so point the suffix at whatever does that in the
  # run environment (a wildcard record, or an entry the operator publishes for the trial network).
  proxy_host_suffix: proxy.invalid
  dummy_token_ref: zero-paid-dummy-token

host_scan_policy:
  secret_environment:
    provider_credential: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  forbidden_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN
  forbidden_argv_environment:
    host_provider_credential: CORTEX_BENCH_ZERO_PAID_FORBIDDEN_ARGV
  repository_checkout_environment: CORTEX_BENCH_ZERO_PAID_CHECKOUT
  host_identity_environment:
    machine: CORTEX_BENCH_ZERO_PAID_IDENTITY

# The address space concurrent trials are carved out of. Slot k takes the k-th /24, its gateway
# is .1 and its container is .2; slot 0 is the 172.30.240.0/24 every committed run so far used.
docker_network:
  subnet_pool: 172.30.240.0/20
  subnet_prefix: 24

proxy:
  # The synthetic credential is named, never carried; the host reads this variable.
  credential_env: CORTEX_BENCH_ZERO_PAID_CREDENTIAL
  request_body_limit_bytes: 16777216
  response_body_limit_bytes: 16777216
  # The container reaches the route, so the listener is bound for it and advertised by admission.
  listen_host: 0.0.0.0

arms:
  - name: zero-paid-pi-direct
    kind: cortex
    backend: pi
    provider: deepseek
    model: deepseek-v4-flash
    credential_capability: pi-deepseek-api-key
    orchestration:
      mode: direct
      ask_manager: false
    limits:
      max_provider_requests: 200
      max_cost_usd: "2.00"
      deadline_seconds: 1800
      max_output_tokens: 65536

tasks:
  - task_id: zero-paid-one
    path: tasks/zero-paid-one
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55
  - task_id: zero-paid-two
    path: tasks/zero-paid-two
    image_ref: cortex-bench-zero-paid-runtime@sha256:8b075847d21e55633a0f2bc2f3d7f9920f91d8aaf47b0778cb1d528a7dbedf55

comparisons: []
