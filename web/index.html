<!-- output: SPA document shell with no-flash theme initialization -->
<!-- pos:    Browser entry document for the Cortex web application -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/theme.css" />
    <meta name="theme-color" content="" />
    <title>Cortex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // No-flash theme: apply the persisted (or OS-preferred) theme before first paint so a dark
      // user never sees a light flash. Mirrors src/theme/theme.ts resolveInitialTheme — keep in sync.
      (function () {
        try {
          var stored = null;
          try { stored = window.localStorage.getItem('cortex.theme'); } catch (e) {}
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var preference = stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored : prefersDark ? 'dark' : 'light';
          var theme = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = theme;
          var chrome = getComputedStyle(document.documentElement).getPropertyValue('--browser-theme-color').trim();
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && chrome) meta.setAttribute('content', chrome);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
