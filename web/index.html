<!-- input:  Vite entry, persisted theme/accent, system color scheme -->
<!-- output: SPA shell, native compatibility and no-flash theme -->
<!-- pos:    Browser entry document for the Cortex web application -->
<!-- >>> If I am updated, update my header comment and CORTEX.md <<< -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="cortex-native-notifications" content="1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/theme.css" />
    <meta name="theme-color" content="" />
    <title>Cortex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // No-flash appearance: apply persisted theme, accent, surface, and motion before first paint.
      // Mirrors src/theme/theme.ts parsing and DOM attributes — keep in sync.
      (function () {
        try {
          var stored = null;
          try { stored = window.localStorage.getItem('cortex.theme'); } catch (e) {}
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var preference = stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored : prefersDark ? 'dark' : 'light';
          var theme = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = theme;
          var storedAccent = null;
          try { storedAccent = window.localStorage.getItem('cortex.accent-hue'); } catch (e) {}
          var accentHue = Number(storedAccent);
          if (storedAccent !== null && storedAccent.trim() !== '' && Number.isInteger(accentHue) && accentHue >= 0 && accentHue <= 359) {
            document.documentElement.setAttribute('data-accent', 'custom');
            document.documentElement.style.setProperty('--accent-hue', String(accentHue));
          }
          var palette = null;
          try { palette = JSON.parse(window.localStorage.getItem('cortex.palette') || 'null'); } catch (e) {}
          if (palette && typeof palette === 'object') {
            var props = { bgHue: '--bg-hue', bgChroma: '--bg-chroma', bgLight: '--bg-light',
              inkHue: '--ink-hue', inkChroma: '--ink-chroma', inkContrast: '--ink-contrast' };
            for (var key in props) {
              if (typeof palette[key] === 'number' && isFinite(palette[key])) {
                document.documentElement.style.setProperty(props[key], String(palette[key]));
              }
            }
          }
          var intensity = null;
          try { intensity = window.localStorage.getItem('cortex.accent-intensity'); } catch (e) {}
          if (intensity === 'soft' || intensity === 'vivid') {
            document.documentElement.setAttribute('data-accent-intensity', intensity);
          }
          var motion = null;
          try { motion = window.localStorage.getItem('cortex.motion'); } catch (e) {}
          if (motion === 'full' || motion === 'reduced') {
            document.documentElement.setAttribute('data-motion', motion);
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var probe = document.createElement('span');
            probe.style.cssText = 'display:none;color:var(--browser-theme-color)';
            document.documentElement.appendChild(probe);
            var computed = getComputedStyle(probe).color;
            probe.remove();
            var parts = computed.match(/[\d.]+/g);
            if (parts && parts.length >= 3) {
              var scale = /^color/.test(computed) ? 255 : 1;
              var hex = '#';
              for (var n = 0; n < 3; n++) {
                var ch = Math.max(0, Math.min(255, Math.round(Number(parts[n]) * scale)));
                hex += ('0' + ch.toString(16)).slice(-2);
              }
              meta.setAttribute('content', hex);
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
